spring.application.name=caseProject
spring.datasource.url=jdbc:h2:mem:caseproject;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
migros.radius-meters=100
migros.reentry-cooldown-millis=60000
rate-limit.capacity=60
rate-limit.refill-tokens=60
rate-limit.refill-interval-millis=60000